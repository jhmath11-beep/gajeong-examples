<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업사이클링 모둠 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Gaegu:wght@400;700&display=swap">
<style>
/* Hallmark · genre: editorial (utilitarian workshop) · macrostructure: 수선집 작업표(접수 번호 + 공정 칸 + 담당 메모) / 공정 칸반 · theme: custom "denim + basting thread"
 * fonts: Gasoek One (display: 모둠 번호·단계 머리) + 시스템 한글 고딕 (body, 학생 폰 가독성·무다운로드) + Gaegu (outlier: 선생님 메모 한 가지 역할)
 * nav: 2칸 탭 · footer: 없음(앱 화면) · enrichment: none — 바늘땀 점선만
 * pre-emit critique: P4 H5 E4 S5 R4 V5 */
:root {
  --color-paper:     oklch(97.6% 0.006 255);  /* 무명 흰 천 */
  --color-paper-2:   oklch(93.6% 0.014 258);
  --color-ink:       oklch(27% 0.075 266);    /* 데님 인디고 */
  --color-on-ink:    oklch(97.6% 0.006 255);
  --color-muted:     oklch(45% 0.04 266);
  --color-rule:      oklch(36% 0.06 266);
  --color-rule-soft: oklch(84% 0.02 260);
  --color-thread:    oklch(51% 0.19 356);     /* 시침실 분홍 — 지금 단계·선생님 메모 */
  --color-thread-bg: oklch(95.5% 0.025 356);
  --color-warn:      oklch(45% 0.11 62);      /* 막힘 — 글자는 늘 '막힘' 단어와 함께 */
  --color-warn-bg:   oklch(95.5% 0.04 80);
  --color-backdrop:  oklch(27% 0.075 266 / 0.5);
  --color-focus:     oklch(51% 0.19 356);

  --font-display: "Gasoek One", "Malgun Gothic", sans-serif;
  --font-body:    system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-note:    "Gaegu", cursive;

  --text-xs: 0.8125rem; --text-sm: 0.9375rem; --text-md: 1.0625rem; --text-lg: 1.3rem;
  --text-xl: 1.75rem;   --text-2xl: clamp(2rem, 4vw + 1rem, 3.1rem);
  --space-3xs: 0.25rem; --space-2xs: 0.5rem; --space-xs: 0.75rem; --space-sm: 1rem;
  --space-md: 1.5rem;   --space-lg: 2.25rem; --space-xl: 3.5rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-short: 150ms;
  --wrap: 46rem; --wrap-wide: 96rem;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; font-family: var(--font-body); color: var(--color-ink); background: var(--color-paper); font-size: var(--text-md); line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--font-body); font-weight: 800; font-style: normal; line-height: 1.2; overflow-wrap: anywhere; min-width: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.spacer { flex: 1; }
.hint { color: var(--color-muted); font-size: var(--text-sm); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: max(var(--space-sm), env(safe-area-inset-left)); }
body.wide .wrap { max-width: var(--wrap-wide); }

/* ── 머리 ── */
.top { background: var(--color-ink); color: var(--color-on-ink); }
.top__in { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-sm); padding-top: var(--space-md); }
.top h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); line-height: 1.1; }
.top .sub { font-size: var(--text-sm); opacity: .92; padding-bottom: var(--space-sm); }
.seam { height: 0; border-top: 2px dashed var(--color-on-ink); opacity: .55; margin-top: var(--space-xs); }
.tabs { display: flex; gap: 0; margin-top: var(--space-xs); }
.tab { min-height: 46px; padding: 0 var(--space-md); border: 0; background: transparent; color: var(--color-on-ink); cursor: pointer; font-weight: 700; white-space: nowrap; opacity: .8; }
.tab[aria-selected="true"] { background: var(--color-paper); color: var(--color-ink); opacity: 1; }

.demo__in { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); align-items: center; padding-block: var(--space-2xs); font-size: var(--text-sm); border-bottom: 1px solid var(--color-rule-soft); }
.demo__badge { font-weight: 800; color: var(--color-thread); border: 1.5px dashed var(--color-thread); padding: 0 var(--space-2xs); white-space: nowrap; }

main.wrap { padding-top: var(--space-md); padding-bottom: var(--space-xl); }
.stack > * + * { margin-top: var(--space-md); }

/* ── 버튼 ── */
.btn { min-height: 44px; padding: 0 var(--space-md); border: 2px solid var(--color-ink); border-radius: 0; background: var(--color-ink); color: var(--color-on-ink);
  font-weight: 800; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center;
  transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform 100ms var(--ease-out); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn--line { background: transparent; color: var(--color-ink); }
.btn--line[aria-pressed="true"] { background: var(--color-ink); color: var(--color-on-ink); }
.btn--sm { min-height: 40px; padding: 0 var(--space-sm); font-size: var(--text-sm); }
.btn--block { width: 100%; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--color-ink); color: var(--color-on-ink); border-color: var(--color-thread); }
  .btn--line:not([aria-pressed="true"]):hover { background: var(--color-paper-2); color: var(--color-ink); }
}

/* ── 작업표(티켓) 공통: 칸 나눔 표 ── */
.ticket { border: 2px solid var(--color-rule); background: var(--color-paper); min-width: 0; }
.ticket__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--color-rule); }
.ticket__row:last-child { border-bottom: 0; }
.cell { padding: var(--space-2xs) var(--space-sm); min-width: 0; }
.cell + .cell { border-left: 1px solid var(--color-rule); }
.cell > span, .label { display: block; font-size: var(--text-xs); font-weight: 700; color: var(--color-muted); letter-spacing: .02em; }
.cell--full { grid-column: 1 / -1; }
.input { width: 100%; min-height: 44px; padding: 0; border: 0; border-radius: 0; background: transparent; font-size: var(--text-md); }
textarea.input { min-height: 5.5rem; resize: vertical; padding-top: var(--space-3xs); line-height: 1.5; }
.input:focus { outline: none; }
.cell:focus-within { background: var(--color-thread-bg); box-shadow: inset 0 -3px 0 var(--color-thread); }
.input::placeholder { color: var(--color-muted); opacity: 1; }
.counter { float: right; font-style: normal; font-weight: 400; font-variant-numeric: tabular-nums; }
.login { max-width: 26rem; }
.login__no { display: flex; align-items: baseline; gap: var(--space-2xs); padding: var(--space-sm); border-bottom: 2px solid var(--color-rule); }
.login__no h2 { font-size: var(--text-xl); }

/* ── 모둠 보드 머리: 큰 접수 번호 ── */
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 2px solid var(--color-rule); }
.head__no { display: grid; place-items: center; padding: var(--space-xs) var(--space-sm); background: var(--color-ink); color: var(--color-on-ink); text-align: center; }
.head__no b { font-family: var(--font-display); font-weight: 400; font-size: 2.6rem; line-height: 1; }
.head__no small { font-size: var(--text-xs); }
.head__info { padding: var(--space-xs) var(--space-sm); display: flex; flex-direction: column; gap: var(--space-3xs); min-width: 0; }
.head__acts { display: flex; gap: var(--space-2xs); flex-wrap: wrap; margin-top: var(--space-3xs); }
.memo-t { border: 2px dashed var(--color-thread); padding: var(--space-xs) var(--space-sm); background: var(--color-thread-bg); }
.memo-t .label { color: var(--color-thread); }
.note { font-family: var(--font-note); font-size: 1.45rem; line-height: 1.35; color: var(--color-thread); font-weight: 700; }

/* ── 공정 라인(바늘땀으로 이은 역) ── */
.line { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); list-style: none; margin: 0; padding: 0; position: relative; }
.line::before { content: ""; position: absolute; left: 10%; right: 10%; top: 1.3rem; border-top: 2px dashed var(--color-rule-soft); }
.st { position: relative; text-align: center; font-size: var(--text-xs); line-height: 1.3; color: var(--color-muted); min-width: 0; }
.st b { position: relative; display: grid; place-items: center; width: 2.6rem; height: 2.6rem; margin: 0 auto var(--space-3xs); background: var(--color-paper);
  border: 2px solid var(--color-rule-soft); font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--color-muted); }
.st.is-done b { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-on-ink); }
.st.is-now b { border: 2px dashed var(--color-thread); color: var(--color-thread); background: var(--color-thread-bg); }
.st.is-now, .st.is-done { color: var(--color-ink); font-weight: 700; }

/* ── 단계 칸(접었다 폈다) ── */
.stage { border: 2px solid var(--color-rule); background: var(--color-paper); }
.stage + .stage { margin-top: -2px; }
.stage summary { display: flex; align-items: center; gap: var(--space-sm); min-height: 52px; padding: 0 var(--space-sm); cursor: pointer; list-style: none; white-space: nowrap; }
.stage summary::-webkit-details-marker { display: none; }
.stage summary h3 { font-size: var(--text-lg); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.stage summary .k { font-family: var(--font-display); font-size: var(--text-lg); color: var(--color-muted); width: 1.5rem; }
.stage summary .cnt { font-size: var(--text-sm); font-weight: 700; color: var(--color-muted); }
.stage summary::after { content: "펼치기"; font-size: var(--text-xs); color: var(--color-muted); }
.stage[open] summary::after { content: "접기"; }
.stage.is-now { outline: 2px dashed var(--color-thread); outline-offset: -7px; }
.stage.is-now .k, .stage.is-now .cnt { color: var(--color-thread); }
.stage.is-done .cnt { color: var(--color-ink); }
.checks { list-style: none; margin: 0; padding: 0 var(--space-sm) var(--space-sm); }
.checks label { display: flex; align-items: center; gap: var(--space-xs); min-height: 48px; padding: var(--space-3xs) 0; border-top: 1px dashed var(--color-rule-soft); cursor: pointer; }
.checks input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--color-ink); }
.checks input:checked + span { text-decoration: line-through; text-decoration-color: var(--color-thread); text-decoration-thickness: 2px; color: var(--color-muted); }

.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) 0 max(var(--space-xs), env(safe-area-inset-bottom));
  background: var(--color-paper); border-top: 2px solid var(--color-rule); }
.savebar .btn { min-height: 52px; flex: 1; font-size: var(--text-lg); }
.dirty { font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; }
.dirty.on { color: var(--color-thread); font-weight: 800; }

/* ── 교사: 현황판 ── */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2xs); align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--color-rule); }
.seg button { min-height: 40px; padding: 0 var(--space-sm); border: 0; background: var(--color-paper); cursor: pointer; font-weight: 700; white-space: nowrap; font-size: var(--text-sm); }
.seg button + button { border-left: 1px solid var(--color-rule); }
.seg button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-on-ink); }
.facts { font-size: var(--text-sm); color: var(--color-muted); }
.facts b { color: var(--color-ink); font-variant-numeric: tabular-nums; }
.kanban { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }
.col { min-width: 0; }
.col__head { display: flex; align-items: baseline; gap: var(--space-2xs); padding-bottom: var(--space-2xs); border-bottom: 2px solid var(--color-rule); margin-bottom: var(--space-xs); }
.col__head h2 { font-size: var(--text-lg); }
.col__head .num { color: var(--color-muted); font-size: var(--text-sm); font-weight: 700; }
.col--pre .col__head, .col--end .col__head { border-bottom-style: dashed; }
.cards { display: grid; gap: var(--space-xs); }
.card { border: 2px solid var(--color-rule); background: var(--color-paper); min-width: 0; }
.card__top { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: stretch; border-bottom: 1px solid var(--color-rule); }
.card__no { display: grid; place-items: center; min-width: 3.4rem; padding: var(--space-3xs) var(--space-2xs); background: var(--color-ink); color: var(--color-on-ink); font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
.card__no small { display: block; font-family: var(--font-body); font-size: var(--text-xs); margin-bottom: 2px; }
.card__meta { padding: var(--space-3xs) var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); min-width: 0; }
.card__meta > span { display: inline-block; white-space: nowrap; margin-right: var(--space-2xs); }
.pips { display: flex; gap: 3px; margin-top: 3px; }
.pips i { width: 14px; height: 10px; border: 1.5px solid var(--color-ink); }
.pips i.f { background: var(--color-ink); }
.pips i.h { border-style: dashed; border-color: var(--color-thread); background: var(--color-thread-bg); }
.card__body { padding: var(--space-2xs) var(--space-xs); display: grid; gap: var(--space-3xs); font-size: var(--text-sm); }
.card__body p { min-width: 0; }
.tagline { font-weight: 800; font-size: var(--text-xs); white-space: nowrap; padding: 0 var(--space-3xs); margin-right: var(--space-3xs); }
.tag--block { color: var(--color-warn); background: var(--color-warn-bg); border: 1.5px solid var(--color-warn); }
.tag--stale { color: var(--color-muted); border: 1.5px dashed var(--color-muted); }
.card.is-stale { border-style: dashed; }
.card .note { font-size: 1.25rem; }
.card__foot { border-top: 1px solid var(--color-rule-soft); display: flex; }
.card__foot .btn { flex: 1; border: 0; min-height: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-3xs); }
.chip { border: 1.5px dashed var(--color-rule); padding: 0 var(--space-2xs); font-size: var(--text-sm); white-space: nowrap; }
.empty { padding: var(--space-md) var(--space-sm); color: var(--color-muted); border: 1.5px dashed var(--color-rule-soft); }

.blocks { display: grid; gap: var(--space-sm); }
.block { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 2px solid var(--color-rule); }
.block .card__no { min-width: 4rem; font-size: 1.8rem; }
.block__in { padding: var(--space-xs) var(--space-sm); display: grid; gap: var(--space-2xs); min-width: 0; }
.block__text { font-size: var(--text-lg); font-weight: 700; }
.fb-row { display: flex; gap: var(--space-2xs); align-items: flex-end; flex-wrap: wrap; }
.fb-row .cell { flex: 1 1 14rem; border: 1px solid var(--color-rule); }
.scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.table th, .table td { padding: var(--space-2xs) var(--space-xs); border: 1px solid var(--color-rule-soft); text-align: left; vertical-align: top; }
.table th { background: var(--color-paper-2); border-color: var(--color-rule); white-space: nowrap; }
.table td.n { text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }

body.tv { font-size: 1.2rem; }
body.tv .top, body.tv .demo, body.tv .tv-hide { display: none !important; }
body.tv .card__no { font-size: 2rem; min-width: 4.4rem; }
body.tv .col__head h2 { font-size: var(--text-xl); }
body.tv main.wrap { padding-top: var(--space-sm); }
body.hide-private .private { filter: blur(6px); user-select: none; }
.tv-exit { position: fixed; right: var(--space-sm); top: var(--space-sm); z-index: 5; }

dialog { width: min(30rem, calc(100% - 2rem)); padding: 0; border: 2px solid var(--color-rule); border-radius: 0; background: var(--color-paper); color: var(--color-ink); }
dialog::backdrop { background: var(--color-backdrop); }
dialog[open] { animation: rise 260ms var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.dlg__head { padding: var(--space-sm); border-bottom: 2px dashed var(--color-rule); }
.dlg__head h2 { font-size: var(--text-xl); }
.dlg__body { padding: var(--space-sm); display: grid; gap: var(--space-sm); }
.dlg__body .cell { border: 1px solid var(--color-rule); }
.dlg__foot { display: flex; gap: var(--space-2xs); justify-content: flex-end; flex-wrap: wrap; padding: var(--space-sm); border-top: 1px solid var(--color-rule-soft); }

#toast { position: fixed; right: var(--space-sm); bottom: max(var(--space-sm), env(safe-area-inset-bottom)); max-width: min(28rem, calc(100% - 2rem));
  background: var(--color-ink); color: var(--color-on-ink); padding: var(--space-xs) var(--space-sm); opacity: 0; pointer-events: none; transition: opacity var(--dur-short) var(--ease-out); z-index: 10; }
#toast.show { opacity: 1; }
#toast.err { background: var(--color-thread); }

@media (min-width: 40rem) {
  .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st { font-size: var(--text-sm); }
}
@media (min-width: 64rem) {
  .kanban { grid-template-columns: repeat(var(--cols, 7), minmax(0, 1fr)); gap: var(--space-sm); }
  .col { border-left: 1px dashed var(--color-rule-soft); padding-left: var(--space-sm); }
  .col:first-child { border-left: 0; padding-left: 0; }
  .blocks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ── 모션 (motion-effects kit에서 필요한 것만) ── */
:root {
  --mk-accent: var(--color-thread);
  --mk-ease-out: cubic-bezier(.22,1,.36,1); --mk-ease-in-out: cubic-bezier(.65,0,.35,1);
  --mk-fast: 160ms; --mk-base: 280ms; --mk-slow: 520ms; --mk-stagger: 45ms;
}
@keyframes mk-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes mk-slide-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes mk-slide-right { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes mk-scale-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes mk-squash { 0% { transform: none; } 30% { transform: scale(1.12, .86); } 55% { transform: scale(.94, 1.08); } 75% { transform: scale(1.03, .98); } 100% { transform: none; } }
@keyframes mk-wiggle { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes mk-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes mk-wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes mk-blink { 50% { opacity: 0; } }
@keyframes mk-particle { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@keyframes mk-ripple { to { transform: scale(1); opacity: 0; } }
.mk-fade-in { animation: mk-fade-in var(--mk-base) var(--mk-ease-out) both; }
.mk-slide-up { animation: mk-slide-up var(--mk-base) var(--mk-ease-out) both; }
.mk-slide-right { animation: mk-slide-right var(--mk-slow) var(--mk-ease-out) both; }   /* 카드가 다음 단계 칸으로 옮겨 옴 */
.mk-scale-in { animation: mk-scale-in var(--mk-base) var(--mk-ease-out) both; }
.mk-stagger > * { animation: mk-slide-up var(--mk-base) var(--mk-ease-out) both; animation-delay: calc(var(--i, 0) * var(--mk-stagger)); }
.mk-squash { animation: mk-squash 520ms var(--mk-ease-out); transform-origin: 50% 100%; }
.mk-wiggle { animation: mk-wiggle 380ms var(--mk-ease-out); }
.mk-pulse { animation: mk-pulse 1s var(--mk-ease-in-out) 2; }
.mk-wave { display: inline-flex; gap: 3px; margin-left: 6px; }
.mk-wave > i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: mk-wave 900ms var(--mk-ease-in-out) infinite; animation-delay: calc(var(--i, 0) * 90ms); }
.mk-caret::after { content: ""; display: inline-block; width: .08em; height: 1em; margin-left: .06em; background: currentColor; vertical-align: -.12em; animation: mk-blink 1s steps(1) infinite; }

    .concat(DATA.groups.slice().sort((a, b) => C.classes.indexOf(a.cls) - C.classes.indexOf(b.cls) || a.group - b.group).map(g => { const P = progress(g, C);
      return [g.cls, g.group, P.stage < C.stages.length ? C.stages[P.stage].name : '완료', ...C.stages.map((s, i) => `${P.per[i]}/${s.checks.length}`), `${P.done}/${P.total}`,
        md(g.updatedAt), Math.floor(daysSince(g.updatedAt, DATA.now)), g.memo, g.next, g.blocker, g.feedback]; })));
});

/* ======================= 시작 ======================= */
async function init() {
  if (!IS_GAS) { $('#demoBar').hidden = false; $('#demoPinHint').hidden = false; }
  try { CONFIG = await api('getConfig'); }
  catch (e) { $('#projName').textContent = '설정을 불러오지 못했어요. 새로고침해 보세요. (' + e.message + ')'; return; }
  $('#appTitle').textContent = CONFIG.appTitle; document.title = CONFIG.appTitle;
  $('#projName').textContent = `${CONFIG.projectName} · ${CONFIG.stages.map(s => s.name).join(' → ')}`;
  $('#gCls').innerHTML = '<option value="">반 고르기</option>' + CONFIG.classes.map(c => `<option>${esc(c)}</option>`).join('');
  $('#gNo').innerHTML = '<option value="">모둠 고르기</option>' + opts(CONFIG.groups, n => n + '모둠');
}
$('#demoFill').addEventListener('click', () => { if (DEMO.load().length && !confirm('지금 체험 데이터를 지우고 샘플 11개로 바꿀까요?')) return; demoFill(); toast('1반·2반 샘플 모둠 11개를 넣었어요. 현황판(PIN 1234)에서 보세요.'); if (DATA) reloadT(); });
$('#demoClear').addEventListener('click', () => { if (!confirm('체험 데이터를 모두 지울까요?')) return; localStorage.removeItem(DEMO_KEY); toast('체험 데이터를 지웠어요.'); if (DATA) reloadT(); });
init();
MK.ripple(document, '.btn');
</script>
