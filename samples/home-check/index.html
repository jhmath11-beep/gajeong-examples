<!--
  무엇을 하는 앱: 집을 공간별(현관·거실·주방·욕실·내 방·베란다/다용도실)로 돌며 화재·전기·가스·넘어짐·환기/습기·에너지 항목을 점검하고, 취약 분야를 찾아 위험도×고치기 쉬움으로 고칠 일 순서를 정한 뒤 가족 약속서를 만들고 1~2주 뒤 재점검해 비교하는 점검표
  수업 장면: 주생활(안전하고 쾌적한 주거) — 과제로 1차 점검 → 수업에서 결과 요약·취약 분야 발표 → 고칠 일 우선순위·담당·기한 정해 가족 약속서 인쇄 → 1~2주 뒤 2차 점검 → 개선된 항목 비교. 휴대폰 없는 학생은 빈 점검표 인쇄본으로
  설정 바꾸는 곳: 아래 <script> 맨 위 CONFIG (공간·분야·점검 항목 문장·근거·기본 위험도/고치기 쉬움·고치는 방법). 화면 안 [항목 설정]에서도 고칠 수 있고, [파일로 저장]으로 학생에게 나눠 줄 수 있음
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 안전·에너지 점검표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V5
 * Hallmark · genre: editorial(utilitarian) · theme: custom (inspection checklist on a clipboard — 소방·관리사무소 점검 체크시트, 검정 인쇄 + 파란 볼펜 기입 + 빨간 확인 도장) · macrostructure: workbench / ruled form with title block
 * contrast: ink on sheet ≈ 15:1, muted ≈ 7:1, red ≈ 5.6:1, pen ≈ 8:1, on-board text ≈ 8:1 (AA)
 */
:root {
  --color-board:       oklch(40% 0.045 62);    /* 클립보드 판 */
  --color-board-2:     oklch(34% 0.040 62);
  --color-on-board:    oklch(96% 0.010 80);
  --color-clip:        oklch(70% 0.010 250);
  --color-clip-edge:   oklch(48% 0.012 250);
  --color-sheet:       oklch(98.3% 0.004 230);  /* 점검표 용지 */
  --color-sheet-2:     oklch(94.8% 0.006 230);
  --color-rule:        oklch(80% 0.010 240);
  --color-rule-strong: oklch(28% 0.015 250);
  --color-ink:         oklch(21% 0.015 250);
  --color-muted:       oklch(45% 0.015 250);
  --color-on-ink:      oklch(97.5% 0.005 230);
  --color-red:         oklch(50% 0.190 27);     /* 소방 적색 · 부적합 · 확인 도장 */
  --color-red-soft:    oklch(95% 0.025 27);
  --color-pen:         oklch(43% 0.160 262);    /* 파란 볼펜 기입 */
  --color-pen-soft:    oklch(94% 0.030 262);
  --color-na:          oklch(62% 0.010 250);
  --color-focus:       oklch(50% 0.170 262);
  --color-shadow:      oklch(18% 0.030 60 / 0.45);
  --color-scrim:       oklch(18% 0.020 250 / 0.55);

  --font-display: "Do Hyeon", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body:    "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-mono:    "IBM Plex Mono", "Consolas", monospace;

  --fs-xs: 0.8125rem; --fs-sm: 0.9375rem; --fs-base: 1.0625rem; --fs-lg: 1.3rem; --fs-xl: 1.75rem;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;
  --sheet-max: 72rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 140ms;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.6; color: var(--color-ink); background: var(--color-board); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; font-style: normal; line-height: 1.2; margin: 0; overflow-wrap: anywhere; min-width: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.hidden { display: none !important; }
.code { white-space: nowrap; }
.num, .code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 판 위 도구줄 */
.bar { max-width: var(--sheet-max); margin: 0 auto; padding: var(--sp-4) clamp(0.5rem, 2vw, 1rem) 0; display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: flex-end; }
.btn { min-height: 44px; padding: 0 var(--sp-4); border: 1.5px solid var(--color-rule-strong); border-radius: 2px; background: var(--color-sheet); color: var(--color-ink); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); font-weight: 600; font-size: var(--fs-sm);
  transition: background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out); }
.btn:hover { background: var(--color-sheet-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-on-ink); }
.btn.primary:hover { background: var(--color-rule-strong); }
.btn.danger { color: var(--color-red); border-color: var(--color-red); }
.btn.small { min-height: 44px; padding: 0 var(--sp-3); font-size: var(--fs-xs); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.bar .btn { border-color: var(--color-board-2); }
.linkbtn { min-height: 44px; border: 0; background: none; color: var(--color-pen); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0 var(--sp-1); font-weight: 600; }

/* 점검표 용지 */
.sheet { position: relative; max-width: var(--sheet-max); margin: var(--sp-6) auto var(--sp-12); background: var(--color-sheet); box-shadow: 0 2px 0 var(--color-board-2), 0 18px 40px -18px var(--color-shadow); padding: clamp(1rem, 3vw, 2.25rem); padding-top: clamp(1.75rem, 4vw, 3rem); }
.clip { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 168px; height: 40px; background: var(--color-clip); border: 2px solid var(--color-clip-edge); border-radius: 6px 6px 3px 3px; }
.clip::after { content: ""; position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: 46px; height: 9px; border-radius: 6px; background: var(--color-board); border: 1.5px solid var(--color-clip-edge); }
@media (max-width: 640px) { .sheet { margin-inline: 6px; } .clip { width: 120px; } }

/* 머리: 서식 제목 + 확인란 */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-4) var(--sp-6); align-items: end; border-bottom: 3px double var(--color-rule-strong); padding-bottom: var(--sp-4); }
.form-no { font-size: var(--fs-xs); color: var(--color-muted); letter-spacing: 0.02em; }
.head h1 { font-size: clamp(1.75rem, 2.6vw + 1rem, 2.75rem); letter-spacing: -0.01em; margin-top: 2px; }
.head h1 .red { color: var(--color-red); }
.head .lede { margin-top: var(--sp-2); color: var(--color-muted); font-size: var(--fs-sm); max-width: 46em; }
.approve { border-collapse: collapse; font-size: var(--fs-xs); text-align: center; }
.approve th { background: var(--color-sheet-2); font-weight: 600; padding: 2px var(--sp-2); border: 1px solid var(--color-rule-strong); white-space: nowrap; }
.approve td { border: 1px solid var(--color-rule-strong); height: 3.6rem; min-width: 5.4rem; padding: 2px var(--sp-1); vertical-align: middle; font-family: var(--font-body); }
.approve td.pen { color: var(--color-pen); font-weight: 600; }
.stamp { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border: 2.5px solid var(--color-red); border-radius: 50%; color: var(--color-red); font-family: var(--font-display); font-size: 1rem; line-height: 1; rotate: -10deg; }
@media (max-width: 760px) { .head { grid-template-columns: minmax(0, 1fr); } .approve { width: 100%; } .approve td { min-width: 0; } }

/* 회차 + 탭 */
.round { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--color-rule); }
.round b { font-weight: 600; font-size: var(--fs-sm); }
.seg { display: inline-flex; border: 1.5px solid var(--color-rule-strong); border-radius: 2px; }
.seg button { min-height: 44px; min-width: 4.5rem; padding: 0 var(--sp-3); border: 0; background: var(--color-sheet); cursor: pointer; white-space: nowrap; font-weight: 600; font-size: var(--fs-sm); }
.seg button + button { border-left: 1.5px solid var(--color-rule-strong); }
.seg button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-on-ink); }
.round .muted { font-size: var(--fs-xs); }

.tabs { display: flex; overflow-x: auto; border-bottom: 1.5px solid var(--color-rule-strong); margin-top: var(--sp-4); scrollbar-width: thin; }
.tab { flex: 1 0 auto; min-height: 48px; padding: 0 var(--sp-4); border: 1.5px solid transparent; border-bottom: 0; margin-bottom: -1.5px; background: transparent; cursor: pointer; white-space: nowrap; font-family: var(--font-display); font-size: 1.1rem; color: var(--color-muted); display: inline-flex; align-items: center; gap: var(--sp-2); }
.tab .n { font-family: var(--font-mono); font-size: var(--fs-xs); border: 1px solid currentColor; width: 1.5rem; height: 1.5rem; display: inline-grid; place-items: center; border-radius: 50%; }
.tab[aria-selected="true"] { color: var(--color-ink); background: var(--color-sheet); border-color: var(--color-rule-strong); border-bottom: 1.5px solid var(--color-sheet); }
.pane { padding-top: var(--sp-6); }
.pane h2 { font-size: var(--fs-xl); }
.pane h2 + p, .sub { color: var(--color-muted); font-size: var(--fs-sm); margin-top: var(--sp-1); }

/* 1. 점검 정보 */
.info-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--sp-8); margin-top: var(--sp-6); }
@media (max-width: 860px) { .info-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }
.field { display: grid; gap: var(--sp-1); margin-bottom: var(--sp-4); }
.field label, .field .lab { font-weight: 600; font-size: var(--fs-sm); }
.field small { color: var(--color-muted); font-size: var(--fs-xs); }
.input { min-height: 44px; padding: var(--sp-2) var(--sp-3); border: 1.5px solid var(--color-rule-strong); border-radius: 2px; background: var(--color-sheet); width: 100%; min-width: 0; }
.input:focus-visible { outline-offset: 0; }
select.input { padding-right: var(--sp-2); }
.row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.row .input { flex: 1 1 10rem; width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); padding: 0; list-style: none; }
.chips li { display: inline-flex; align-items: center; border: 1.5px solid var(--color-pen); color: var(--color-pen); border-radius: 2px; padding-left: var(--sp-3); font-weight: 600; }
.chips li button { min-width: 44px; min-height: 40px; border: 0; background: none; cursor: pointer; color: var(--color-pen); font-size: 1.1rem; }
.note { border: 1px dashed var(--color-rule-strong); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); background: var(--color-sheet-2); }
.howto { counter-reset: s; padding: 0; margin: var(--sp-3) 0 0; list-style: none; border-top: 1px solid var(--color-rule-strong); }
.howto li { counter-increment: s; display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: var(--sp-2); padding: var(--sp-3) 0; border-bottom: 1px solid var(--color-rule); font-size: var(--fs-sm); }
.howto li::before { content: counter(s); font-family: var(--font-display); font-size: 1.6rem; line-height: 1; color: var(--color-red); }
.howto b { display: block; font-size: var(--fs-base); }
.legend-marks { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); font-size: var(--fs-sm); }
.legend-marks span { display: inline-flex; align-items: center; gap: var(--sp-1); }

/* 표시 기호: ○ × ／ */
.mk { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.mk svg { width: 100%; height: 100%; display: block; }

/* 2. 공간별 점검 */
.spacenav { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }
.spacenav a { min-height: 44px; display: inline-flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); border: 1px solid var(--color-rule-strong); border-radius: 2px; text-decoration: none; color: var(--color-ink); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; background: var(--color-sheet); }
.spacenav a .num { color: var(--color-muted); font-weight: 500; }
.spacenav a.done .num { color: var(--color-pen); }
.space { margin-top: var(--sp-8); scroll-margin-top: var(--sp-4); }
.space-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--sp-2); border-bottom: 2px solid var(--color-rule-strong); padding-bottom: var(--sp-2); }
.space-head h3 { font-size: 1.5rem; }
.space-head h3 .code { font-size: var(--fs-sm); color: var(--color-muted); margin-right: var(--sp-2); }
.space-head .prog { font-size: var(--fs-sm); color: var(--color-muted); }
.item { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: var(--sp-2) var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--color-rule); align-items: start; }
.item .code { font-size: var(--fs-sm); padding-top: 3px; color: var(--color-muted); }
.item .q { font-weight: 600; }
.item .why { font-size: var(--fs-sm); color: var(--color-muted); margin-top: 2px; }
.item .why b { font-weight: 600; color: var(--color-ink); margin-right: var(--sp-1); }
.ftag { display: inline-block; font-size: var(--fs-xs); font-weight: 600; border: 1px solid var(--color-rule-strong); padding: 0 6px; margin-left: var(--sp-1); white-space: nowrap; vertical-align: 1px; }
.ans { display: flex; flex-wrap: nowrap; }
.ans button { min-height: 44px; min-width: 4.4rem; padding: 0 var(--sp-2); border: 1.5px solid var(--color-rule-strong); background: var(--color-sheet); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-sm); white-space: nowrap; color: var(--color-muted); }
.ans button + button { margin-left: -1.5px; }
.ans button .mk { opacity: .35; }
.ans button[aria-pressed="true"] { position: relative; z-index: 1; font-weight: 600; }
.ans button[aria-pressed="true"] .mk { opacity: 1; }
.ans button[data-v="y"][aria-pressed="true"] { color: var(--color-pen); background: var(--color-pen-soft); border-color: var(--color-pen); }
.ans button[data-v="n"][aria-pressed="true"] { color: var(--color-red); background: var(--color-red-soft); border-color: var(--color-red); }
.ans button[data-v="na"][aria-pressed="true"] { color: var(--color-ink); background: var(--color-sheet-2); border-color: var(--color-ink); }
.memo { grid-column: 2 / -1; }
.memo .input { min-height: 44px; font-size: var(--fs-sm); border-width: 0 0 1px 0; border-style: dashed; border-color: var(--color-rule-strong); background: transparent; padding-left: 0; color: var(--color-pen); }
@media (max-width: 760px) {
  .item { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .ans { grid-column: 1 / -1; }
  .ans button { flex: 1 1 0; min-width: 0; }
  .memo { grid-column: 1 / -1; }
}
.foot-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-8); padding-top: var(--sp-4); border-top: 1.5px solid var(--color-rule-strong); align-items: center; }

/* 3. 결과 요약 */
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--color-rule-strong); margin-top: var(--sp-6); }
.tally div { padding: var(--sp-3) var(--sp-4); border-left: 1px solid var(--color-rule); }
.tally div:first-child { border-left: 0; }
.tally .lab { font-size: var(--fs-xs); color: var(--color-muted); font-weight: 600; display: flex; align-items: center; gap: var(--sp-1); }
.tally .v { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; }
.tally .v small { font-family: var(--font-body); font-size: var(--fs-sm); color: var(--color-muted); margin-left: 2px; }
@media (max-width: 560px) { .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tally div:nth-child(3) { border-left: 0; } .tally div:nth-child(n+3) { border-top: 1px solid var(--color-rule); } }
.sum-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-8); margin-top: var(--sp-8); }
@media (max-width: 960px) { .sum-grid { grid-template-columns: minmax(0, 1fr); } }
.sum-grid h3 { font-size: var(--fs-lg); border-bottom: 2px solid var(--color-rule-strong); padding-bottom: var(--sp-1); }
.bars { list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: var(--sp-1) var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--color-rule); align-items: center; }
.bars .name { font-weight: 600; font-size: var(--fs-sm); }
.bars .cnt { grid-column: 2; font-size: var(--fs-xs); color: var(--color-muted); }
.cells { display: flex; height: 26px; border: 1.5px solid var(--color-rule-strong); }
.cells span { flex: 1 1 0; border-left: 1px solid var(--color-rule); background: var(--color-sheet); }
.cells span:first-child { border-left: 0; }
.cells .y { background: var(--color-pen); border-left-color: var(--color-sheet); }
.cells .n { background: repeating-linear-gradient(-45deg, var(--color-red) 0 3px, var(--color-red-soft) 3px 7px); }
.cells .na { background: repeating-linear-gradient(90deg, var(--color-sheet-2) 0 4px, var(--color-sheet) 4px 8px); }
.bar-key { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-size: var(--fs-xs); color: var(--color-muted); margin-top: var(--sp-2); }
.bar-key i { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--color-rule-strong); vertical-align: -2px; margin-right: 4px; }
.bar-key i.y { background: var(--color-pen); } .bar-key i.n { background: repeating-linear-gradient(-45deg, var(--color-red) 0 3px, var(--color-red-soft) 3px 7px); } .bar-key i.na { background: repeating-linear-gradient(90deg, var(--color-sheet-2) 0 4px, var(--color-sheet) 4px 8px); } .bar-key i.e { background: var(--color-sheet); }
.weak { margin-top: var(--sp-8); border: 2px solid var(--color-red); padding: var(--sp-4) var(--sp-6); }
.weak h3 { font-size: var(--fs-lg); color: var(--color-red); }
.weak ol { margin: var(--sp-3) 0 0; padding: 0; list-style: none; counter-reset: w; }
.weak > ol > li { counter-increment: w; display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--sp-2); padding: var(--sp-3) 0; border-top: 1px solid var(--color-rule); }
.weak > ol > li::before { content: counter(w); font-family: var(--font-display); font-size: 2rem; line-height: 1; color: var(--color-red); }
.weak > ol > li b { font-size: var(--fs-lg); font-family: var(--font-display); font-weight: 400; }
.weak > ol > li .muted { font-size: var(--fs-sm); }
.weak li ul { margin: var(--sp-1) 0 0; padding-left: 1.1em; font-size: var(--fs-sm); }
.weak li ul .code { color: var(--color-muted); margin-right: var(--sp-1); }
.empty { border: 1.5px dashed var(--color-rule-strong); padding: var(--sp-6); margin-top: var(--sp-6); text-align: left; }
.empty b { display: block; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-lg); margin-bottom: var(--sp-1); }
.empty .btn { margin-top: var(--sp-3); }

/* 4. 고칠 일 */
.matrix-wrap { margin-top: var(--sp-6); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
.matrix { display: grid; grid-template-columns: 4.2rem repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--color-rule-strong); }
.matrix > div { border-left: 1px solid var(--color-rule); border-top: 1px solid var(--color-rule); padding: var(--sp-2); min-height: 4.5rem; }
.matrix .mh { background: var(--color-sheet-2); font-weight: 600; font-size: var(--fs-xs); min-height: 0; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3; }
.matrix .mh.side { justify-content: flex-start; }
.matrix .corner { font-size: var(--fs-xs); color: var(--color-muted); }
.matrix .cell { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; position: relative; padding-top: 1.6rem; }
.matrix .cell .q-lab { position: absolute; top: 4px; left: var(--sp-2); font-size: var(--fs-xs); color: var(--color-muted); font-weight: 600; }
.matrix .cell.hot { background: var(--color-red-soft); }
.matrix .cell.hot .q-lab { color: var(--color-red); }
.chip { min-height: 32px; padding: 0 8px; border: 1.5px solid var(--color-ink); background: var(--color-sheet); font-family: var(--font-mono); font-size: var(--fs-xs); cursor: pointer; border-radius: 2px; white-space: nowrap; }
.chip.r3 { border-color: var(--color-red); color: var(--color-red); }
.chip.done { text-decoration: line-through; opacity: .6; }
.matrix-axis { font-size: var(--fs-xs); color: var(--color-muted); }
@media (max-width: 560px) { .matrix { grid-template-columns: 3rem repeat(3, minmax(0, 1fr)); } .matrix .cell .q-lab { display: none; } .matrix .cell { padding-top: var(--sp-2); } }

.fixes { list-style: none; margin: var(--sp-8) 0 0; padding: 0; border-top: 2px solid var(--color-rule-strong); counter-reset: f; }
.fix { counter-increment: f; display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: var(--sp-2) var(--sp-3); padding: var(--sp-4) 0; border-bottom: 1px solid var(--color-rule); scroll-margin-top: var(--sp-4); }
.fix::before { content: counter(f); font-family: var(--font-display); font-size: 1.9rem; line-height: 1; color: var(--color-ink); }
.fix.flash { background: var(--color-pen-soft); }
.fix .t { font-weight: 600; }
.fix .t .code { color: var(--color-muted); font-weight: 500; margin-right: var(--sp-2); font-size: var(--fs-sm); }
.fix .memo-line { font-size: var(--fs-sm); color: var(--color-pen); }
.fix-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2) var(--sp-3); margin-top: var(--sp-2); }
.fix-grid .wide { grid-column: 1 / -1; }
.fix-grid label { font-size: var(--fs-xs); font-weight: 600; color: var(--color-muted); display: grid; gap: 2px; }
.donechk { display: inline-flex !important; grid-template-columns: none; align-items: center; gap: var(--sp-2) !important; min-height: 44px; font-size: var(--fs-sm) !important; color: var(--color-ink) !important; cursor: pointer; }
.donechk input, .agree input { width: 22px; height: 22px; accent-color: var(--color-pen); }
@media (max-width: 760px) { .fix-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.agree { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-6); padding: var(--sp-4); border: 1.5px solid var(--color-rule-strong); flex-wrap: wrap; }
.agree label { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 44px; font-weight: 600; cursor: pointer; }

/* 5. 재점검 비교 */
.cmp { width: 100%; border-collapse: collapse; margin-top: var(--sp-6); font-size: var(--fs-sm); }
.cmp th, .cmp td { border-bottom: 1px solid var(--color-rule); padding: var(--sp-2) var(--sp-2); text-align: left; vertical-align: middle; }
.cmp thead th { border-bottom: 2px solid var(--color-rule-strong); font-size: var(--fs-xs); color: var(--color-muted); white-space: nowrap; }
.cmp td.c { text-align: center; white-space: nowrap; }
.cmp .code { color: var(--color-muted); }
.st { display: inline-block; padding: 1px 8px; border: 1.5px solid currentColor; font-weight: 600; font-size: var(--fs-xs); white-space: nowrap; }
.st.up { color: var(--color-pen); }
.st.still { color: var(--color-red); }
.st.down { color: var(--color-red); background: var(--color-red-soft); }
.st.same { color: var(--color-muted); border-color: transparent; }
.cmp tr.grp th { background: var(--color-sheet-2); font-size: var(--fs-sm); color: var(--color-ink); border-bottom: 1px solid var(--color-rule-strong); }
@media (max-width: 640px) { .cmp .hide-sm { display: none; } }

/* 대화상자 */
dialog { border: 2px solid var(--color-rule-strong); border-radius: 2px; padding: 0; background: var(--color-sheet); color: var(--color-ink); width: min(46rem, calc(100% - 16px)); max-height: calc(100dvh - 32px); }
dialog::backdrop { background: var(--color-scrim); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 2px solid var(--color-rule-strong); position: sticky; top: 0; background: var(--color-sheet); z-index: 2; }
.dlg-head h2 { font-size: var(--fs-lg); }
.dlg-body { padding: var(--sp-4); }
.dlg-foot { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--color-rule); position: sticky; bottom: 0; background: var(--color-sheet); }
.pchoice { display: grid; gap: var(--sp-2); }
.pchoice button { text-align: left; min-height: 64px; padding: var(--sp-3) var(--sp-4); border: 1.5px solid var(--color-rule-strong); background: var(--color-sheet); cursor: pointer; border-radius: 2px; }
.pchoice button:hover { background: var(--color-sheet-2); }
.pchoice b { display: block; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-lg); }
.pchoice span { font-size: var(--fs-sm); color: var(--color-muted); }
.ed-space { margin-bottom: var(--sp-6); }
.ed-space h3 { font-size: var(--fs-lg); border-bottom: 2px solid var(--color-rule-strong); padding-bottom: var(--sp-1); }
.ed-row { border-bottom: 1px solid var(--color-rule); padding: var(--sp-3) 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: var(--sp-2); }
.ed-row .wide { grid-column: 1 / -1; }
.ed-row label { font-size: var(--fs-xs); color: var(--color-muted); font-weight: 600; display: grid; gap: 2px; }
.ed-row .del { align-self: end; }
@media (max-width: 560px) { .ed-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--color-ink); color: var(--color-on-ink); padding: var(--sp-3) var(--sp-4); border-radius: 2px; font-size: var(--fs-sm); z-index: 50; max-width: calc(100% - 24px); }

/* ── 모션 (motion-effects kit에서 필요한 것만) ── */
:root {
  --mk-accent: var(--color-pen);
  --mk-ease-out: cubic-bezier(.22,1,.36,1); --mk-ease-in-out: cubic-bezier(.65,0,.35,1);
  --mk-fast: 160ms; --mk-base: 280ms; --mk-slow: 520ms; --mk-stagger: 45ms;
}
@keyframes mk-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes mk-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes mk-slide-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes mk-scale-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes mk-wipe-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes mk-stamp { from { opacity: 0; transform: scale(1.7); } to { opacity: 1; transform: none; } }
@keyframes mk-seal { 0% { opacity: 0; transform: scale(1.9); } 40% { opacity: 1; transform: scale(1.14, .84); } 65% { transform: scale(.95, 1.06); } 85% { transform: scale(1.02, .98); } 100% { transform: none; } }
@keyframes mk-squash { 0% { transform: none; } 30% { transform: scale(1.12, .86); } 55% { transform: scale(.94, 1.08); } 75% { transform: scale(1.03, .98); } 100% { transform: none; } }
@keyframes mk-wiggle { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes mk-glitch { 0%, 100% { transform: none; text-shadow: none; } 20% { transform: translate(-2px, 1px); text-shadow: 2px 0 rgba(255,0,60,.6), -2px 0 rgba(0,200,255,.6); } 40% { transform: translate(2px, -1px); } 60% { transform: translate(-1px, 0); text-shadow: -2px 0 rgba(255,0,60,.6), 2px 0 rgba(0,200,255,.6); } 80% { transform: translate(1px, 1px); } }
@keyframes mk-particle { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@keyframes mk-ripple { to { transform: scale(1); opacity: 0; } }
.mk-fade-in { animation: mk-fade-in var(--mk-slow) var(--mk-ease-in-out) both; }
.mk-slide-up { animation: mk-slide-up var(--mk-base) var(--mk-ease-out) both; }
.mk-scale-in { animation: mk-scale-in var(--mk-base) var(--mk-ease-out) both; }
.mk-wipe-in { animation: mk-wipe-in var(--mk-slow) var(--mk-ease-in-out) both; }   /* 결과 막대가 자라남 */
.mk-stagger > * { animation: mk-slide-up var(--mk-base) var(--mk-ease-out) both; animation-delay: calc(var(--i, 0) * var(--mk-stagger)); }
.mk-stamp { animation: mk-stamp var(--mk-fast) var(--mk-ease-out); }   /* ○×／ 표시가 찍힘 */
.mk-seal { animation: mk-seal 560ms var(--mk-ease-out); }               /* '약속' 도장 */
.mk-squash { animation: mk-squash 520ms var(--mk-ease-out); transform-origin: 50% 100%; }
.mk-wiggle { animation: mk-wiggle 380ms var(--mk-ease-out); }
.mk-glitch { animation: mk-glitch 360ms steps(2, end) 1; }
.mk-particle { position: fixed; width: 7px; height: 7px; border-radius: 2px; pointer-events: none; z-index: 9999; background: var(--mk-accent); animation: mk-particle 800ms var(--mk-ease-out) forwards; }
.mk-ghost { position: absolute; pointer-events: none; animation: mk-fade-out var(--mk-slow) var(--mk-ease-in-out) both; }   /* 14 디졸브: 이전 회차 화면 */
.btn { position: relative; overflow: hidden; isolation: isolate; }
.mk-ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .18; transform: scale(0); animation: mk-ripple var(--mk-slow) var(--mk-ease-out) forwards; z-index: -1; }
dialog[open] { animation: mk-scale-in var(--mk-base) var(--mk-ease-out); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* 인쇄 */
#print { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: none; font-size: 9.5pt; line-height: 1.4; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; color: black; }
  .p-page + .p-page { break-before: page; }
  .p-head { display: grid; grid-template-columns: 1fr auto; gap: 6mm; align-items: end; border-bottom: 2.5pt double black; padding-bottom: 3mm; margin-bottom: 4mm; }
  .p-head .no { font-size: 8pt; }
  .p-head h1 { font-size: 20pt; }
  .p-head .meta { font-size: 9pt; margin-top: 1mm; }
  .p-approve { border-collapse: collapse; font-size: 8pt; text-align: center; }
  .p-approve th, .p-approve td { border: 0.8pt solid black; padding: 1pt 4pt; }
  .p-approve td { height: 14mm; min-width: 20mm; }
  .p-approve .stamp { width: 11mm; height: 11mm; font-size: 9pt; }
  #print h2 { font-size: 12pt; margin: 4mm 0 2mm; }
  .p-tbl { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
  .p-tbl th, .p-tbl td { border: 0.6pt solid black; padding: 1.2mm 1.5mm; vertical-align: top; text-align: left; }
  .p-tbl thead th { background: var(--color-sheet-2); font-weight: 600; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-tbl tr { break-inside: avoid; }
  .p-tbl thead th { white-space: nowrap; }
  .p-tbl .grp { break-after: avoid; }
  .p-tbl .c { text-align: center; white-space: nowrap; width: 11mm; }
  .p-tbl .code { width: 9mm; text-align: center; }
  .p-tbl .grp td { background: var(--color-sheet-2); font-weight: 600; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-tbl .why { display: block; font-size: 7.5pt; color: var(--color-muted); }
  .p-tbl .box { display: inline-block; width: 4mm; height: 4mm; border: 0.8pt solid black; }
  .p-tbl .wline { min-width: 30mm; }
  .p-note { font-size: 8pt; margin-top: 2mm; }
  .p-sign { display: flex; flex-wrap: wrap; gap: 4mm 8mm; margin-top: 5mm; font-size: 10pt; }
  .p-sign span { display: inline-flex; align-items: flex-end; gap: 2mm; }
  .p-sign i { display: inline-block; width: 32mm; border-bottom: 0.8pt solid black; height: 8mm; }
  .p-two { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .p-bars td.b { width: 55%; }
  .p-bars td:first-child { white-space: nowrap; }
  .p-bars .cells { height: 4mm; border-width: 0.8pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-mk .mk { width: 3.6mm; height: 3.6mm; }
  .p-promise { font-size: 10.5pt; }
  .p-promise .p-tbl { font-size: 9.5pt; }
  .p-promise .p-tbl td { padding: 2.2mm 2mm; }
}
</style>
</head>
<body>

<div class="bar" role="toolbar" aria-label="점검표 도구">
  <button class="btn primary" id="btnPrint" type="button">인쇄</button>
  <button class="btn" id="btnExport" type="button">파일로 저장</button>
  <button class="btn" id="btnImport" type="button">파일 불러오기</button>
  <input type="file" id="fileIn" accept=".json,application/json" class="hidden">
  <button class="btn" id="btnItems" type="button">항목 설정</button>
  <button class="btn" id="btnSample" type="button">예시로 채워 보기</button>
  <button class="btn danger" id="btnReset" type="button">새로 시작</button>
</div>

<main class="sheet" id="sheet">
  <div class="clip" aria-hidden="true"></div>
  <header class="head">
    <div>
      <p class="form-no">가정 안전 자체 점검 · 서식 HC-1</p>
      <h1>우리 집 <span class="red">안전</span>·에너지 점검표</h1>
      <p class="lede">공간마다 돌아보며 ○(예)·×(아니오)·／(해당 없음)으로 표시하고, 고칠 일을 가족과 약속한 뒤 1~2주 지나 다시 점검합니다.</p>
    </div>
    <table class="approve" aria-label="점검 확인란">
      <tr><th>점검자</th><th>1차 점검</th><th>2차 점검</th><th>가족 확인</th></tr>
      <tr><td class="pen" id="apWho">—</td><td class="pen num" id="apD1">—</td><td class="pen num" id="apD2">—</td><td id="apStamp"></td></tr>
    </table>
  </header>

  <div class="round">
    <b id="roundLab">지금 기록하는 회차</b>
    <div class="seg" role="group" aria-labelledby="roundLab">
      <button type="button" data-round="1" aria-pressed="true">1차 점검</button>
      <button type="button" data-round="2" aria-pressed="false">2차 점검</button>
    </div>
    <span class="muted" id="roundHint"></span>
  </div>

  <nav class="tabs" role="tablist" aria-label="점검표 단계">
    <button class="tab" role="tab" data-tab="info"><span class="n">1</span>점검 정보</button>
    <button class="tab" role="tab" data-tab="check"><span class="n">2</span>공간별 점검</button>
    <button class="tab" role="tab" data-tab="sum"><span class="n">3</span>결과 요약</button>
    <button class="tab" role="tab" data-tab="fix"><span class="n">4</span>고칠 일·약속</button>
    <button class="tab" role="tab" data-tab="cmp"><span class="n">5</span>재점검 비교</button>
  </nav>

  <section class="pane" id="pane" role="tabpanel" aria-live="polite"></section>
</main>

<dialog id="dlgPrint" aria-labelledby="dlgPrintT">
  <div class="dlg-head"><h2 id="dlgPrintT">무엇을 인쇄할까요?</h2><button class="btn small" type="button" data-close>닫기</button></div>
  <div class="dlg-body pchoice">
    <button type="button" data-print="result"><b>점검 결과지</b><span>공간·분야별 결과, 항목별 1차·2차 표시, 고칠 일 목록 (A4)</span></button>
    <button type="button" data-print="promise"><b>가족 약속서</b><span>우선순위 순서의 고칠 일 · 담당 · 기한, 가족 서명란 (A4 1장)</span></button>
    <button type="button" data-print="blank"><b>빈 점검표</b><span>휴대폰 없이 종이로 점검할 때 — 항목과 빈 칸만 (A4)</span></button>
  </div>
</dialog>

<dialog id="dlgItems" aria-labelledby="dlgItemsT">
  <div class="dlg-head"><h2 id="dlgItemsT">점검 항목 설정</h2><button class="btn small" type="button" data-close>닫기</button></div>
  <div class="dlg-body" id="edBody"></div>
  <div class="dlg-foot">
    <button class="btn danger small" type="button" id="edDefault">처음 항목으로</button>
    <button class="btn small" type="button" id="edExport">항목만 파일로</button>
    <button class="btn primary small" type="button" id="edSave">저장</button>
  </div>
</dialog>

<div id="print" aria-hidden="true"></div>

<script>
/* ===================== CONFIG — 교사가 고치는 곳 =====================
 * spaces : 점검할 공간 (code = 항목 번호 앞 글자)
 * fields : 분야
 * items  : 점검 항목 — 문장은 "그렇다면 안전한" 쪽으로 씁니다(예 = 양호, 아니오 = 고칠 일).
 *          why = 왜 위험한지 한 줄(상식 수준), risk 3높음/2보통/1낮음, ease 1쉬움/2보통/3어려움, fix = 고치는 방법 예시
 * 항목 문장·근거는 교과서와 소방청·한국가스안전공사 등 공식 안내로 한 번 더 확인해 쓰세요.
 */
const CONFIG = {
  spaces: [
    { id: "entry", name: "현관", code: "현" },
    { id: "living", name: "거실", code: "거" },
    { id: "kitchen", name: "주방", code: "주" },
    { id: "bath", name: "욕실", code: "욕" },
    { id: "room", name: "내 방", code: "방" },
    { id: "utility", name: "베란다·다용도실", code: "베" }
  ],
  fields: [
    { id: "fire", name: "화재·대피" },
    { id: "elec", name: "전기" },
    { id: "gas", name: "가스" },
    { id: "fall", name: "미끄럼·떨어짐" },
    { id: "air", name: "환기·습기" },
    { id: "energy", name: "에너지 절약" }
  ],
  risk: { 3: "높음", 2: "보통", 1: "낮음" },
  ease: { 1: "쉬움", 2: "보통", 3: "어려움" },
  easeHelp: { 1: "오늘 바로 · 돈이 거의 안 듦", 2: "물건을 사거나 가족 도움 필요", 3: "수리·전문가·비용이 큼" },
  items: [

    s.rounds[r].date = /^\d{4}-\d{2}-\d{2}$/.test(src.date) ? src.date : "";
    if (src.ans && typeof src.ans === "object") {
      for (const [id, a] of Object.entries(src.ans)) {
        if (!a || typeof a !== "object") continue;
        const v = ["y", "n", "na"].includes(a.v) ? a.v : "";
        const memo = clampStr(a.memo, 80);
        if (v || memo) s.rounds[r].ans[String(id).slice(0, 40)] = { v, memo };
      }
    }
  }
  if (raw.fixes && typeof raw.fixes === "object") {
    for (const [id, f] of Object.entries(raw.fixes)) {
      if (!f || typeof f !== "object") continue;
      s.fixes[String(id).slice(0, 40)] = {
        risk: [1, 2, 3].includes(+f.risk) ? +f.risk : 0,
        ease: [1, 2, 3].includes(+f.ease) ? +f.ease : 0,
        who: clampStr(f.who, 10),
        due: /^\d{4}-\d{2}-\d{2}$/.test(f.due) ? f.due : "",
        plan: clampStr(f.plan, 100),

    }

  s.agreed = raw.agreed === true;

}
function normalizeItems(raw) {
  if (!Array.isArray(raw)) return null;
  const seen = new Set();
  const out = raw.filter((it) => it && typeof it === "object" && typeof it.id === "string" && SPACE[it.space] && FIELD[it.field] && typeof it.text === "string" && it.text.trim())
    .filter((it) => !seen.has(it.id) && seen.add(it.id))
    .map((it) => ({ id: it.id.slice(0, 40), space: it.space, field: it.field, risk: [1, 2, 3].includes(+it.risk) ? +it.risk : 2, ease: [1, 2, 3].includes(+it.ease) ? +it.ease : 1,
      text: it.text.trim().slice(0, 120), why: clampStr(it.why, 120).trim(), fix: clampStr(it.fix, 120).trim() }));

}
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
let state = normalize(load(KEY));
let ITEMS = normalizeItems(load(KEY_ITEMS)) || CONFIG.items.map((i) => ({ ...i }));
let saveWarned = false;
function save() {

  catch (e) { if (!saveWarned) { saveWarned = true; toast("이 브라우저에는 저장이 안 돼요. [파일로 저장]으로 보관하세요."); } }
}
function saveItems(custom) {
  try { custom ? localStorage.setItem(KEY_ITEMS, JSON.stringify(ITEMS)) : localStorage.removeItem(KEY_ITEMS); } catch (e) { /* 저장 불가 — 화면에는 반영됨 */ }
}

/* ---------- 계산 ---------- */
function codeOf(item) {
  const list = ITEMS.filter((i) => i.space === item.space);
  return SPACE[item.space].code + (list.indexOf(item) + 1);
}
const ansOf = (r, id) => (state.rounds[r].ans[id] || {}).v || "";
function tally(r, list = ITEMS) {
  const t = { y: 0, n: 0, na: 0, e: 0 };
  list.forEach((i) => { t[ansOf(r, i.id) || "e"]++; });
  return t;
}
function fixOf(item) {
  const f = state.fixes[item.id] || {};
  return { risk: f.risk || item.risk, ease: f.ease || item.ease, who: f.who || "", due: f.due || "", plan: f.plan ?? item.fix, done: !!f.done };
}
function setFix(id, patch) {
  const item = ITEMS.find((i) => i.id === id);
  state.fixes[id] = { ...fixOf(item), ...patch };
  save();
}
function fixList() {
  return ITEMS.filter((i) => ansOf("1", i.id) === "n")
    .map((i) => ({ item: i, f: fixOf(i), order: ITEMS.indexOf(i) }))
    .sort((a, b) => b.f.risk - a.f.risk || a.f.ease - b.f.ease || a.order - b.order);
}
function weakFields(r) {
  return CONFIG.fields.map((f) => {
    const list = ITEMS.filter((i) => i.field === f.id);
    const t = tally(r, list);
    const checked = t.y + t.n;
    return { f, t, rate: checked ? t.n / checked : 0, bad: list.filter((i) => ansOf(r, i.id) === "n") };
  }).filter((w) => w.t.n > 0).sort((a, b) => b.rate - a.rate || b.t.n - a.t.n).slice(0, 3);
}
const fmtDate = (d) => (d ? d.slice(5).replace("-", ".") : "—");

function renderMatrix(list) {
  const m = $("#matrix"); if (!m) return;
  const label = (r, e) => (r === 3 && e === 1 ? "먼저 하기" : r === 3 ? "보호자와 계획" : r === 1 && e === 1 ? "습관으로" : "");
  let h = `<div class="mh corner">위험도 ↓<br>고치기 →</div>` + [1, 2, 3].map((e) => `<div class="mh">${CONFIG.ease[e]}</div>`).join("");
  for (const r of [3, 2, 1]) {
    h += `<div class="mh side">${CONFIG.risk[r]}</div>`;
    for (const e of [1, 2, 3]) {
      const here = list.filter((x) => x.f.risk === r && x.f.ease === e);
      h += `<div class="cell ${r === 3 && e === 1 ? "hot" : ""}">${label(r, e) ? `<span class="q-lab">${label(r, e)}</span>` : ""}${here.map((x) =>
        `<button type="button" class="chip r${r} ${x.f.done ? "done" : ""}" data-jump="${esc(x.item.id)}" title="${esc(x.item.text)}">${esc(codeOf(x.item))}</button>`).join("")}</div>`;
    }
  }
  m.innerHTML = h;
}

/* ---------- 5. 재점검 비교 ---------- */
function statusOf(a, b) {
  if (a === "n" && b === "y") return ["up", "나아짐"];
  if (a === "n" && b === "n") return ["still", "아직"];
  if (a !== "n" && b === "n") return ["down", "새로 생김"];
  if (a === "n" && !b) return ["same", "2차 빈칸"];
  return ["same", ""];
}
function renderCmp(pane) {
  const t1 = tally("1"), t2 = tally("2");
  if (t1.e === ITEMS.length || t2.e === ITEMS.length) {
    const need = t1.e === ITEMS.length ? "1" : "2";
    pane.innerHTML = `<h2>재점검 비교</h2><div class="empty"><b>${need === "1" ? "1차 점검부터 해 주세요." : "2차 점검을 하면 1차와 비교해 보여 줘요."}</b>${need === "2" ? `고칠 일을 실천하고 1~2주 지나 같은 항목을 다시 점검해요.${state.rounds[2].date ? ` 다시 볼 날: ${esc(state.rounds[2].date.replace(/-/g, "."))}` : ""}` : ""}<br><button class="btn primary" type="button" data-go="check" data-round="${need}">${need}차 점검 시작</button></div>`;
    return;
  }
  const rows = ITEMS.map((i) => { const a = ansOf("1", i.id), b = ansOf("2", i.id); return { i, a, b, st: statusOf(a, b) }; });
  const up = rows.filter((x) => x.st[0] === "up").length, still = rows.filter((x) => x.st[0] === "still").length, down = rows.filter((x) => x.st[0] === "down").length;
  const groups = [["up", "나아진 항목"], ["still", "아직 그대로인 항목"], ["down", "새로 생긴 문제"]];
  const mark = (v) => (v ? `<span style="color:${v === "y" ? "var(--color-pen)" : v === "n" ? "var(--color-red)" : "var(--color-muted)"}">${MK[v]}<span class="sr">${ANS_LABEL[v]}</span></span>` : '<span class="muted">·</span>');
  pane.innerHTML = `
  <h2>재점검 비교</h2>
  <p>1차 ${esc(fmtDate(state.rounds[1].date))} → 2차 ${esc(fmtDate(state.rounds[2].date))}</p>
  <div class="tally">
    <div><span class="lab">1차 ×</span><span class="v"><span data-cu="${t1.n}">${t1.n}</span><small>개</small></span></div>
    <div><span class="lab">2차 ×</span><span class="v"><span data-cu="${t2.n}">${t2.n}</span><small>개</small></span></div>
    <div><span class="lab" style="color:var(--color-pen)">나아짐</span><span class="v" style="color:var(--color-pen)"><span data-cu="${up}">${up}</span><small>개</small></span></div>
    <div><span class="lab" style="color:var(--color-red)">아직 · 새로 생김</span><span class="v" style="color:var(--color-red)">${still}<small>·</small>${down}</span></div>
  </div>
  <table class="cmp">
    <thead><tr><th>번호</th><th>항목</th><th class="c">1차</th><th class="c">2차</th><th class="hide-sm">결과</th></tr></thead>
    <tbody>${groups.map(([k, name]) => {
      const g = rows.filter((x) => x.st[0] === k); if (!g.length) return "";
      return `<tr class="grp"><th colspan="5">${name} ${g.length}개</th></tr>` + g.map((x) =>
        `<tr><td class="code num">${esc(codeOf(x.i))}</td><td>${esc(x.i.text)}</td><td class="c">${mark(x.a)}</td><td class="c">${mark(x.b)}</td><td class="hide-sm"><span class="st ${x.st[0]}">${x.st[1]}</span></td></tr>`).join("");
    }).join("") || `<tr><td colspan="5">1차와 2차 모두 × 가 없어요.</td></tr>`}</tbody>
  </table>
  ${rows.some((x) => x.st[1] === "2차 빈칸") ? `<p class="sub" style="margin-top:var(--sp-3)">1차에 × 였는데 2차에 아직 표시하지 않은 항목이 ${rows.filter((x) => x.st[1] === "2차 빈칸").length}개 있어요.</p>` : ""}`;
}

$("#edBody").addEventListener("input", (e) => {
  const row = e.target.closest("[data-idx]"); if (!row || !e.target.dataset.k) return;

    draft.splice(last == null ? draft.length : last + 1, 0, it); renderEditor();

  if (!clean) { MO.play($("#dlgItems"), "mk-wiggle"); toast("항목이 하나 이상 있어야 해요."); return; }
  const dropped = draft.length - clean.length;
  ITEMS = clean; saveItems(true); $("#dlgItems").close(); render();
  toast(dropped ? `문장이 빈 항목 ${dropped}개는 빼고 저장했어요.` : "항목을 저장했어요.");
});
$("#edDefault").addEventListener("click", () => {
  if (!confirm("처음 항목으로 되돌릴까요? 직접 고친 항목은 사라져요(점검 표시는 남아요).")) return;
  ITEMS = CONFIG.items.map((i) => ({ ...i })); saveItems(false); $("#dlgItems").close(); render();
});
$("#edExport").addEventListener("click", () => {
  const clean = normalizeItems(draft) || ITEMS;
  download(`점검항목_${today()}.json`, { app: "homecheck", v: 1, items: clean });
});

/* ---------- 파일 · 예시 · 초기화 ---------- */
function download(name, obj) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$("#btnExport").addEventListener("click", () => {
  const custom = !!load(KEY_ITEMS);
  download(`우리집점검표_${(state.who || "기록").replace(/[\\/:*?"<>|\s]/g, "")}_${today()}.json`, { app: "homecheck", v: 1, items: custom ? ITEMS : null, state });
});
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#fileIn").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > 500000) { toast("파일이 너무 커요. 이 점검표에서 저장한 파일인지 확인해 주세요."); return; }
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { toast("읽을 수 없는 파일이에요."); return; }
  if (!data || data.app !== "homecheck") { toast("이 점검표에서 저장한 파일이 아니에요."); return; }
  const items = normalizeItems(data.items);
  if (data.state) {
    if (!confirm("지금 기록을 이 파일 내용으로 바꿀까요?")) return;
    state = normalize(data.state);
    if (items) { ITEMS = items; saveItems(true); }
    save(); setTab(state.tab); toast("파일을 불러왔어요.");
  } else if (items) {
    if (!confirm(`점검 항목 ${items.length}개를 이 파일 것으로 바꿀까요? 표시한 기록은 남아요.`)) return;
    ITEMS = items; saveItems(true); render(); toast("점검 항목을 바꿨어요.");
  } else toast("파일에 불러올 내용이 없어요.");
});
$("#btnSample").addEventListener("click", () => {
  const has = Object.keys(state.rounds[1].ans).length || Object.keys(state.rounds[2].ans).length;
  if (has && !confirm("지금 기록을 지우고 예시로 채울까요?")) return;
  ITEMS = CONFIG.items.map((i) => ({ ...i })); saveItems(false);
  const s = blankState();
  s.who = "3번"; s.members = ["나", "엄마", "할머니", "동생"];
  const d = new Date(); const iso = (n) => { const x = new Date(d.getTime() + n * 864e5 - d.getTimezoneOffset() * 60000); return x.toISOString().slice(0, 10); };
  s.rounds[1].date = iso(-12); s.rounds[2].date = iso(0);
  const n1 = ["e1", "l1", "l3", "k3", "k4", "b1", "b3", "b4", "r2", "r5", "u1", "u4", "u6"], na = ["u2", "r4"];
  CONFIG.items.forEach((i) => { s.rounds[1].ans[i.id] = { v: na.includes(i.id) ? "na" : n1.includes(i.id) ? "n" : "y", memo: "" }; });
  s.rounds[1].ans.l1.memo = "TV 뒤 멀티탭에 멀티탭 연결"; s.rounds[1].ans.b4.memo = "샤워부스 실리콘 검은 곰팡이"; s.rounds[1].ans.u1.memo = "칸막이 앞에 상자 쌓여 있음";
  const n2 = ["b4", "r5", "u6"];
  CONFIG.items.forEach((i) => { s.rounds[2].ans[i.id] = { v: na.includes(i.id) ? "na" : n2.includes(i.id) ? "n" : "y", memo: "" }; });
  s.rounds[2].ans.l2 = { v: "n", memo: "소파를 옮기다 전선이 깔림" };
  Object.assign(s.fixes, { e1: { who: "나", due: iso(-10) }, l1: { who: "엄마", due: iso(-9) }, k3: { who: "가족 모두", due: iso(-11) }, k4: { who: "나", due: iso(-10) },
    b1: { who: "엄마", due: iso(-5), ease: 2 }, u1: { who: "할머니", due: iso(-7) }, b4: { who: "엄마", due: iso(5), ease: 3 }, r5: { who: "나", due: iso(3) } });
  for (const [id, f] of Object.entries(s.fixes)) { const it = CONFIG.items.find((i) => i.id === id); s.fixes[id] = { risk: it.risk, ease: f.ease || it.ease, who: f.who, due: f.due, plan: it.fix, done: !n2.includes(id) }; }
  s.agreed = true; s.round = "1"; s.tab = "sum";
  state = s; save(); setTab("sum");
});
$("#btnReset").addEventListener("click", () => {
  if (!confirm("점검 기록을 모두 지우고 새로 시작할까요? (점검 항목 설정은 남아요)")) return;
  state = blankState(); save(); setTab("info");
});

/* ---------- 공통 이벤트 ---------- */
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
$$(".tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$(".tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const tabs = $$(".tab"), i = tabs.findIndex((t) => t.dataset.tab === state.tab);
  const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  setTab(n.dataset.tab); n.focus();
});
$$(".seg [data-round]").forEach((b) => b.addEventListener("click", () => {
  if (state.round === b.dataset.round) return;
  dissolvePane(); state.round = b.dataset.round; save(); render(); MO.play($("#pane"), "mk-fade-in");
}));
$("#pane").addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { if (go.dataset.round) state.round = go.dataset.round; setTab(go.dataset.go); window.scrollTo({ top: $("#sheet").offsetTop - 8 }); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { const li = document.getElementById("fx-" + jump.dataset.jump); if (li) { li.scrollIntoView({ block: "center" }); li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1200); const f = li.querySelector("select"); f && f.focus({ preventScroll: true }); } return; }
  const pn = e.target.closest("[data-print-now]");
  if (pn) doPrint(pn.dataset.printNow);
});
$("#btnPrint").addEventListener("click", () => $("#dlgPrint").showModal());
$("#dlgPrint").addEventListener("click", (e) => { const b = e.target.closest("[data-print]"); if (b) doPrint(b.dataset.print); });
$("#btnItems").addEventListener("click", openItems);
$$("dialog [data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
$$("dialog").forEach((d) => d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));

setTab(state.tab);
MO.ripple(document, ".btn");
</script>
</body>
</html>
